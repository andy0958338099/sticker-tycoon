[build]
  command = ""
  functions = "functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

# LINE Webhook 處理（快速返回）

# 貼圖生成 Background Worker（最多執行 15 分鐘）
# 檔名以 -background 結尾，Netlify 會自動識別為 Background Function
# ⚠️ 不要寫 [functions."xxx"] timeout
#
# Netlify function 設定的合法欄位只有：
#   deno_import_map / external_node_modules / ignored_node_modules /
#   included_files / memory / node_bundler / region / schedule / vcpu
# timeout 不在其中 —— 寫了會讓整個部署失敗（逾時由方案決定）。
# 本檔原本有 20 處 timeout 設定，已全部移除。
# ⚠️ memory 需要 credit-based 付費方案，一般方案設 memory 也會讓部署失敗。

